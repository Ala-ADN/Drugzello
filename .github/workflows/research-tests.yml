name: Research tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
      PYTHONHASHSEED: '42'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements/base.txt
            backend/requirements/research.txt
      - name: Install CPU research dependencies
        run: |
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install torch-scatter==2.1.2 --only-binary=:all: -f https://data.pyg.org/whl/torch-2.4.0+cpu.html
          python -m pip install -r backend/requirements/research.txt
      - name: Test recorded evidence and deterministic research behavior
        run: python -m pytest -q backend/tests/research
