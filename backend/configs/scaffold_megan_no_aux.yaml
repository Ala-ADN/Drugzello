# Match scaffold_search.yaml's fixed embedding_joint_32 control.
# Only the three auxiliary loss weights change; masks still affect predictions.
hidden_channels: 32
num_layers: 3
K: 2
heads_gat: 1
use_edge_features: true
dropout: 0.1
layer_norm: true
residual: true
feature_encoding: embedding
embedding_dim: 16
training_schedule: joint
scheduler_metric: total
learning_rate: 0.001
weight_decay: 0.00001
batch_size: 64
num_epochs: 150
patience: 20
gamma_exp: 0.0
beta_sparsity: 0.0
delta_decor: 0.0
log_interval: 25
